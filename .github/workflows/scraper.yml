name: e-Yaygin Kurs Takip Botu

on:
  schedule:
    - cron: '*/15 * * * *' # 15 dakikada bir çalıştır
  workflow_dispatch: # Manuel tetikleme için (cron-job.org için)
  repository_dispatch:
    types: [main]

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # saved_courses.txt dosyasını geri kaydetmek için gerekli izin
      
    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4
      
    - name: Python'u Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps
        
    - name: Botu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py
      
    - name: Değişiklikleri Kaydet (Mükerrer Bildirimleri Engellemek İçin)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add saved_courses.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "bot: kurs hafizasi guncellendi" && git push)
